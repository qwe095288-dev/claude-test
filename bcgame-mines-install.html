<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>踩地雷 Bot 書籤安裝</title>
<style>
:root{--bg:#0c0e14;--card:#12141c;--border:#2a2e3d;--text:#e2e4ea;--sub:#8b8fa3;--green:#4ade80;--blue:#3b82f6;--red:#f87171;--yellow:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.container{max-width:560px;width:100%}
h1{font-size:24px;color:var(--green);margin-bottom:8px;text-align:center}
.subtitle{color:var(--sub);text-align:center;margin-bottom:32px;font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
.card h2{font-size:16px;color:var(--green);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .num{width:28px;height:28px;background:var(--green);color:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.bookmark-link{display:inline-block;padding:14px 28px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;border-radius:10px;text-decoration:none;cursor:grab;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 16px rgba(59,130,246,.3)}
.bookmark-link:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(59,130,246,.4)}
.bookmark-link:active{cursor:grabbing;transform:scale(.97)}
.drag-area{text-align:center;padding:20px;border:2px dashed var(--border);border-radius:10px;margin-top:12px}
.steps{list-style:none;counter-reset:step}
.steps li{position:relative;padding:8px 0 8px 32px;color:var(--sub);font-size:14px;line-height:1.5}
.steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:8px;width:22px;height:22px;background:var(--border);color:var(--text);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.steps li strong{color:var(--text)}
.note{background:#1a1d2a;border-left:3px solid var(--yellow);padding:12px 16px;border-radius:0 8px 8px 0;font-size:13px;color:var(--yellow);margin-top:16px}
.copy-area{margin-top:12px}
.copy-btn{display:block;width:100%;padding:12px;background:var(--green);color:var(--bg);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.copy-btn:hover{opacity:.9}
.code-preview{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:ui-monospace,monospace;font-size:11px;color:var(--sub);max-height:80px;overflow:hidden;word-break:break-all;margin-top:8px;position:relative}
.code-preview::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,var(--bg))}
</style>
</head>
<body>
<div class="container">
<h1>踩地雷 Bot</h1>
<p class="subtitle">BC Game Mines 自動策略工具</p>

<div class="card">

<script>

document.getElementById('codePreview').textContent=code.substring(0,300)+'...';
function copyCode(){

ta.select();
document.execCommand('copy');
ta.remove();

}
